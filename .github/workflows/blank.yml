name: Recover AgentAgent2 from artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruct from logs + zip
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shutil, zipfile
          from pathlib import Path

          root = Path(".")
          logs = [
              "session-events-sesn_01FTDMmq4GUWQmgfm8eCLuJs (1).json",
              "session-events-sesn_01GCNDxoMN7MWiKkATeRvQuZ (1).json",
          ]

          def norm(fp: str):
              fp = fp.replace("\\","/")
              if fp.startswith("/workspace/agentagent2/"):
                  return fp[len("/workspace/agentagent2/"):]
              if fp.startswith("/workspace/AgentAgent2/"):
                  return fp[len("/workspace/AgentAgent2/"):]
              if fp.startswith("/workspace/"):
                  parts = fp.split("/")
                  if len(parts) > 3:
                      return "/".join(parts[3:])
              return fp.lstrip("./")

          # zip baseline
          z = None
          for cand in [root / "agentagent2-complete (1).zip", root / "agentagent2-complete.zip"]:
              if cand.exists():
                  z = cand
                  break

          if z:
              tmp = root / ".recovery_tmp"
              if tmp.exists():
                  shutil.rmtree(tmp)
              tmp.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(z) as zf:
                  zf.extractall(tmp)

              for base in ["agentagent2", "agentagent2-harness"]:
                  src = tmp / base
                  if src.exists():
                      for p in src.rglob("*"):
                          if p.is_file():
                              rel = p.relative_to(src)
                              dst = root / rel
                              dst.parent.mkdir(parents=True, exist_ok=True)
                              dst.write_bytes(p.read_bytes())

              log_src = tmp / "agentagent_log.md"
              if log_src.exists():
                  (root / "agentagent_log.md").write_bytes(log_src.read_bytes())

          # replay write payloads from logs
          written = 0
          for lp in logs:
              p = root / lp
              if not p.exists():
                  print(f"WARN missing log: {lp}")
                  continue
              try:
                  events = json.loads(p.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"WARN cannot parse {lp}: {e}")
                  continue

              for e in events:
                  if e.get("type") == "agent.tool_use" and e.get("name") == "write":
                      inp = e.get("input") or {}
                      fp = inp.get("file_path")
                      ct = inp.get("content")
                      if not fp or ct is None:
                          continue
                      rel = norm(fp)
                      if not rel or rel.startswith("../"):
                          continue
                      out = root / rel
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_text(ct, encoding="utf-8")
                      written += 1

          for d in ["config","design","skills","style","templates","agentagent2-harness","evals"]:
              (root/d).mkdir(parents=True, exist_ok=True)

          (root / "RECOVERY_REPORT.md").write_text(
              "# Recovery Report\n\n"
              "- Method: zip baseline + session-log write replay\n"
              f"- Replayed write events: {written}\n"
              "- Note: truncated logs imply best-effort late-session recovery.\n",
              encoding="utf-8"
          )
          print(f"Recovery completed. Replayed writes: {written}")
          PY

      - name: Commit recovery changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "recover: reconstruct AgentAgent2 from session artifacts"
          git push origin HEAD:main

      - name: Quick smoke (non-blocking)
        shell: bash
        run: |
          set +e
          python - <<'PY'
          import pathlib, py_compile, traceback
          files = [p for p in pathlib.Path(".").rglob("*.py") if ".git/" not in str(p)]
          print(f"Python files: {len(files)}")
          failures = 0
          for f in files:
              try:
                  py_compile.compile(str(f), doraise=True)
              except Exception:
                  failures += 1
                  print(f"FAIL {f}")
                  traceback.print_exc(limit=1)
          print(f"py_compile failures: {failures}")
          PY                  parts = fp.split("/")
                  if len(parts) > 3:
                      return "/".join(parts[3:])
              return fp.lstrip("./")

          written = 0
          for l in logs:
              p = root / l
              if not p.exists():
                  continue
              try:
                  events = json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  continue
              for e in events:
                  if e.get("type") == "agent.tool_use" and e.get("name") == "write":
                      inp = e.get("input") or {}
                      fp = inp.get("file_path")
                      ct = inp.get("content")
                      if not fp or ct is None:
                          continue
                      rel = norm(fp)
                      if not rel or rel.startswith("../"):
                          continue
                      out = root / rel
                      out.parent.mkdir(parents=True, exist_ok=True)
                      out.write_text(ct, encoding="utf-8")
                      written += 1

          # 3) Ensure evidence-backed paths exist (from your logs)
          for d in ["config","design","skills","style","templates","agentagent2-harness","evals"]:
              (root/d).mkdir(parents=True, exist_ok=True)

          report = root / "RECOVERY_REPORT.md"
          report.write_text(
              "# Recovery Report\n\n"
              "- Method: zip baseline + session-log write replay\n"
              f"- Replayed write events: {written}\n"
              "- Note: source logs are truncated; recovery is best-effort for late-session mutations.\n",
              encoding="utf-8"
          )
          print(f"Recovered with {written} replayed writes.")
          PY

      - name: Commit recovery changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "recover: reconstruct AgentAgent2 from session artifacts"
          git push origin HEAD:main

      - name: Quick smoke report (non-blocking)
        shell: bash
        run: |
          set +e
          python -m py_compile $(git ls-files '*.py') >/tmp/pyc.out 2>&1
          echo "## py_compile" >> $GITHUB_STEP_SUMMARY
          tail -n 50 /tmp/pyc.out >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
