[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentagent2"
version = "1.0.0"
description = "AgentAgent2 harness: a deployable meta-agent that designs and builds Claude agents to a verified quality bar."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentAgent2" }]
keywords = ["agent", "llm", "anthropic", "claude", "tool-use", "harness"]

# Core has ZERO required third-party dependencies (stdlib only) for maximum
# independent deployability. Optional extras below are convenience only.
dependencies = []

[project.optional-dependencies]
# The official SDK is optional; the harness talks to the Messages API over stdlib urllib by default.
sdk = ["anthropic>=0.39"]
server = []  # stdlib http.server; no extra deps
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8"]

[project.scripts]
agentagent2 = "agentagent2.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
